seed: 42
architecture: resnet101
weights: ImageNet1K_V2
classes: [Forest, Greenhouse, Field, Water, Building]
num_classes: 5
label_field: class_en

split:
  unit: polygon_object
  validation_fraction: 0.20
  exclude_positive_area_overlap_with_test_region: true

input:
  crop_mode: dual_average
  crop_expansion: 1.5
  input_size_px: 224
  value_min: 0.0
  value_max: 255.0
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]

training:
  epochs: 50
  batch_size: 32
  optimizer: Adam
  learning_rate: 0.0001
  loss: cross_entropy
  dropout: 0.6
  workers: 0
  checkpoint_metric: object_validation_accuracy

provenance_note: >-
  This is the executable reproduction configuration derived from the manuscript,
  retained prediction code and verified annotations. The historical training
  script and training log were not retained.

